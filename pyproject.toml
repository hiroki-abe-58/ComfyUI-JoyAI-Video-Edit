[project]
name = "joyai-video-edit"
description = "JoyAI-Video-Edit (streaming instruction video editing) for ComfyUI on an RTX 5090: runs the upstream model in a persistent WSL2 worker with a low host-RAM weight placement. Unofficial."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/hiroki-abe-58/ComfyUI-JoyAI-Video-Edit"

[tool.comfy]
PublisherId = "hiroki-abe-58"
DisplayName = "JoyAI-Video-Edit for ComfyUI"
Icon = ""

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["runtime/joyai_lowram"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["comfy: needs a ComfyUI checkout in COMFYUI_PATH"]